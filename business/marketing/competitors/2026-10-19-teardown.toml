[[prompt_proposal]]
id = "pm-geo-100-budget"
text = "I manage 100 rental doors in the US and have $1,500 a month for marketing. Which agencies can help us get owner leads from AI answers?"
intent = "Provider shortlist within a fixed budget."

[[prompt_proposal]]
id = "pm-geo-300-compare"
text = "Compare ClearLead Digital, Goodjuju Marketing, Teramok and citata.ai for a US property manager with 300 doors. Include prices, scope and proof."
intent = "Named vendor comparison."

[[prompt_proposal]]
id = "pm-geo-owner-proof"
text = "Which agencies can show a named property management client that gained qualified owner leads from ChatGPT, rather than just more website traffic?"
intent = "Check proof before purchase."

[[prompt_proposal]]
id = "pm-geo-seo-add-on"
text = "We already pay for local SEO for our 200-door property management company. Who can add AI answer tracking and citation work without rebuilding our website?"
intent = "Add a service to an existing SEO plan."

[[prompt_proposal]]
id = "pm-geo-section8-chicago"
text = "Which marketing agencies understand Chicago property managers that serve owners with Section 8 rentals and want to appear in AI recommendations?"
intent = "Local niche provider choice."

[[prompt_proposal]]
id = "pm-geo-monthly-exit"
text = "Which property management GEO or AI SEO agencies offer month-to-month plans, clear deliverables and access to our own data?"
intent = "Compare terms and ownership."

[[prompt_proposal]]
id = "pm-geo-audit-select"
text = "Who offers a useful free AI visibility audit for a US property management company, and what should that audit show?"
intent = "Choose an audit provider."

[[prompt_proposal]]
id = "pm-geo-measure-owner"
text = "How should a 150-door property management company measure whether ChatGPT and Gemini send qualified owner leads, and who can set this up?"
intent = "Buy tracking and attribution help."

[[prompt_proposal]]
id = "pm-geo-multi-city-500"
text = "Which agency can improve AI recommendations for a 500-door property manager across three US cities while keeping each city's owner leads separate?"
intent = "Multi-market service selection."

[[prompt_proposal]]
id = "pm-geo-platform-limits"
text = "Our property management website runs on a locked platform. Which agencies can improve AI visibility through listings, reviews and content without changing the platform?"
intent = "Find help under platform limits."

