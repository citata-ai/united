# Model business and agencies with published proof. Claims are vendor claims. Fetched 2026-10-17..18.
# Every [[agency]] has a `role`. Apply [rule] before you call a company a competitor (Tao, 2026-10-19).

[rule]
direct = "Sells SEO, GEO/AEO or marketing to US property management companies (residential, single-family and small multifamily, 50-500 doors) to win landlord/owner leads."
not_direct = [
  "Serves real estate agents, brokers or teams (buyer and seller leads)",
  "Serves developers: presale, new construction, lease-up",
  "Serves large multifamily operators for renter leads (apartment marketing, occupancy)",
  "Sells software only (PMS, proptech SaaS), not a done-for-you service",
  "General GEO/SEO agency with no property management offer",
]
roles = { direct = "same buyer, same job: track and copy", model = "business model we clone (FirstIndex)", adjacent = "different buyer; use only as proof or tactic reference", "non-competitor" = "different niche; do not track as a competitor, do not benchmark against it" }
check = "Read the home page and the pricing/clients page. If most offers or case studies target agents, developers or renter lease-up, the role is non-competitor even when one page says 'property management'."

[model]
name = "FirstIndex"
role = "model"
url = "https://firstindex.co"
owner = "Josh Pigford (Baremetrics, Maybe Finance), Ordinary Systems LLC"
icp = "SaaS companies"
price = "$2,000/mo month to month; $1,500/mo on 12 months"
anchor = "about $25,000/mo at an SEO agency"
stages = ["Indexed", "Found", "Mentioned"]
monthly_scope = ["up to 12 articles", "50+ page fixes", "index checks", "vs pages and free tools", "AI answer tracking and fixes", "weekly report"]
process = ["one-sentence goal by email", "access: CMS or repo, GSC, Analytics", "one change a day, human check", "Monday report"]
proof = "one unnamed chart: <1 to 164 clicks/day, 41 to 9.4K impressions/day by week 12"
channels = ["founder X audience", "public SEO audit threads", "podcasts", "build in public"]
gaps = ["no named case studies", "one audience", "one price", "no guarantee"]

