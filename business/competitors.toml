# Model business and agencies with published proof. Claims are vendor claims. Fetched 2026-10-17..18.

[model]
name = "FirstIndex"
url = "https://firstindex.co"
owner = "Josh Pigford (Baremetrics, Maybe Finance), Ordinary Systems LLC"
icp = "SaaS companies"
price = "$2,000/mo month to month; $1,500/mo on 12 months"
anchor = "about $25,000/mo at an SEO agency"
stages = ["Indexed", "Found", "Mentioned"]
monthly_scope = ["up to 12 articles", "50+ page fixes", "index checks", "vs pages and free tools", "AI answer tracking and fixes", "weekly report"]
process = ["one-sentence goal by email", "access: CMS or repo, GSC, Analytics", "one change a day, human check", "Monday report"]
proof = "one unnamed chart: <1 to 164 clicks/day, 41 to 9.4K impressions/day by week 12"
channels = ["founder X audience", "public SEO audit threads", "podcasts", "build in public"]
gaps = ["no named case studies", "one audience", "one price", "no guarantee"]

[[agency]]
name = "Teramok"
url = "https://www.teramok.us/ai-seo-for-property-management"
vertical = "property management / developers"
claim = "112 AI-assistant sessions in 90 days (Miami developer)"
price = "$8,000-25,000/mo"

