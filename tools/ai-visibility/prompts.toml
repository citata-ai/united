# Prompts for the citata.ai AI-visibility check. Each prompt runs on every engine.
# Niche: GEO / AEO for property management companies that see fewer owner leads.
# Keep ids stable: the weekly loop compares runs by id. Add prompts; do not edit old ones.

brand = ["citata.ai", "citata", "Citata"]
our_domain = "citata.ai"
# What the extractor lists from each answer.
entity = "agencies, consultants, tools or companies that offer GEO, AEO, AI search or SEO services"
out_dir = "business/marketing/ai-visibility"

# --- brand: does AI know us at all? ---
[[prompt]]
id = "brand-what"
group = "brand"
text = "What is citata.ai?"

[[prompt]]
id = "brand-reviews"
group = "brand"
text = "Is citata.ai a good GEO agency? Reviews and prices."

# --- pm-geo: the core niche, buyer asks for a provider ---
[[prompt]]
id = "pm-geo-agency"
group = "pm-geo"
text = "Which agencies do GEO (generative engine optimization) for property management companies? Give names."

[[prompt]]
id = "pm-aeo-agency"
group = "pm-geo"
text = "Best AEO or AI search optimization agency for a property management company in the US?"

[[prompt]]
id = "pm-chatgpt-recommend"
group = "pm-geo"
text = "How do I get ChatGPT to recommend my property management company when landlords ask for a property manager?"

[[prompt]]
id = "pm-ai-overviews"
group = "pm-geo"
text = "How can a property management company show up in Google AI Overviews and AI Mode?"

[[prompt]]
id = "pm-geo-cost"
group = "pm-geo"
text = "How much does GEO or AI SEO cost for a property management company, and who offers it?"

[[prompt]]
id = "pm-geo-small"
group = "pm-geo"
text = "I run a property management company with 200 doors. Is there a done-for-you service that gets us cited by AI assistants?"

# --- pm-leads: the pain, before the buyer knows the word GEO ---
[[prompt]]
id = "pm-leads-decline"
group = "pm-leads"
text = "Our property management company gets fewer owner leads from Google every month. Why, and what should we do?"

[[prompt]]
id = "pm-owner-search"
group = "pm-leads"
text = "How do landlords find a property manager in 2026? Do they use ChatGPT?"

[[prompt]]
id = "pm-seo-worth"
group = "pm-leads"
text = "Is SEO still worth it for property management companies now that people use AI search?"

[[prompt]]
id = "pm-marketing-agency"
group = "pm-leads"
text = "Best marketing agencies for property management companies that want more owner leads in 2026?"

[[prompt]]
id = "pm-owner-leads"
group = "pm-leads"
text = "How can a property management company get more rental owner leads without paying for ads?"

# --- pm-how: informational, AI eats the click; we want a mention ---
[[prompt]]
id = "pm-llms-txt"
group = "pm-how"
text = "Should a property management website have an llms.txt file and schema markup for AI search?"

[[prompt]]
id = "pm-track-ai"
group = "pm-how"
text = "How can a property management company track traffic and leads that come from ChatGPT and other AI assistants?"

[[prompt]]
id = "pm-ai-visibility-check"
group = "pm-how"
text = "How do I check if AI assistants mention my property management company? Is there a free AI visibility audit?"

[[prompt]]
id = "pm-section8-ai"
group = "pm-how"
text = "How can a property manager that accepts Section 8 get found by landlords in AI search?"

# --- geo-general: wider GEO market, small business ---
[[prompt]]
id = "geo-agency-small"
group = "geo-general"
text = "Best done-for-you GEO agencies for small businesses with a monthly plan under $2,000?"

[[prompt]]
id = "geo-firstindex-alt"
group = "geo-general"
text = "What are alternatives to FirstIndex for GEO and AI search optimization?"

[[prompt]]
id = "geo-case-study"
group = "geo-general"
text = "Show me real GEO case studies with numbers for local service businesses or real estate."

# --- landlord-data: H11 (added 2026-11-17, B040). Questions our data pages answer. ---
# Metric: share of answers that cite a citata.ai URL (cited_us), not mentions.
# The comment above each prompt names the citata.ai page that answers it.

# /guides/section-8-rent-limits/chicago-fair-market-rent-2027
[[prompt]]
id = "ll-s8-chicago-2br"
group = "landlord-data"
text = "How much will Section 8 pay for a 2-bedroom apartment in Chicago in 2027?"

# /guides/section-8-rent-limits/houston-fair-market-rent-2027
[[prompt]]
id = "ll-s8-houston-3br"
group = "landlord-data"
text = "What is the Section 8 fair market rent for a 3-bedroom house in Houston for 2027?"

# /guides/section-8-rent-limits/payment-standard-cuts-2026
[[prompt]]
id = "ll-s8-payment-cuts"
group = "landlord-data"
text = "Which housing authorities are cutting Section 8 payment standards in 2026, and what does it mean for landlords?"

# /guides/section-8-rent-limits/section-8-funding-2027
[[prompt]]
id = "ll-s8-funding-2027"
group = "landlord-data"
text = "Is Section 8 funding being cut in 2027? What should landlords with voucher tenants do now?"

# /tools/section-8-rent-calculator
[[prompt]]
id = "ll-s8-tenant-share"
group = "landlord-data"
text = "How do I calculate how much rent Section 8 pays and how much the tenant pays?"

# /guides/property-management-fees-by-state
[[prompt]]
id = "ll-pm-fees-state"
group = "landlord-data"
text = "How much do property managers charge by state? Compare monthly and leasing fees in Texas, Florida and California."

# /guides/how-much-does-a-property-manager-cost-owner
[[prompt]]
id = "ll-pm-cost-2000"
group = "landlord-data"
text = "How much does a property manager cost in the first year for a single-family rental that rents for $2,000 a month?"

# /guides/appfolio-vs-buildium
[[prompt]]
id = "ll-appfolio-buildium"
group = "landlord-data"
text = "AppFolio vs Buildium: which is better and cheaper for a property management company with about 100 doors?"

# /guides/rentvine-vs-appfolio-vs-buildium-vs-doorloop
[[prompt]]
id = "ll-pm-software-4"
group = "landlord-data"
text = "Compare Rentvine, AppFolio, Buildium and DoorLoop on price per unit and minimums."

# /guides/should-i-rent-or-sell-my-house, /tools/rent-vs-sell-calculator
[[prompt]]
id = "ll-rent-vs-sell"
group = "landlord-data"
text = "Should I rent out my house or sell it? How do I run the numbers?"
